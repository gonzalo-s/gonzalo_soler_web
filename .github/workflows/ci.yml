name: CI

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
